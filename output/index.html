<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Output – MKE</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <a href="/" class="sidebar-logo">MKE</a>
            <ul class="sidebar-nav">
                <li><a href="/output/" class="active">Output</a></li>
                <li><a href="/captures/">Captures</a></li>
                <li><a href="/intake/">Intake</a></li>
                <li><a href="/about/">About</a></li>
            </ul>
        </aside>

        <main class="main">
            <h1>Output</h1>
            <ul class="post-list" id="post-list">
                <li style="color:#999;">Loading posts...</li>
            </ul>
        </main>
    </div>

    <script>
        fetch('/output/posts/posts.json')
            .then(function(response) { return response.json(); })
            .then(function(posts) {
                // Sort by date (newest first)
                posts.sort(function(a, b) {
                    return new Date(b.date) - new Date(a.date);
                });

                var list = document.getElementById('post-list');
                list.innerHTML = '';

                posts.forEach(function(post) {
                    var li = document.createElement('li');

                    var a = document.createElement('a');
                    a.href = '/output/post.html?slug=' + post.slug;
                    a.textContent = post.title;

                    var span = document.createElement('span');
                    span.className = 'date';
                    var date = new Date(post.date);
                    var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                                  'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
                    span.textContent = months[date.getMonth()] + ' ' + date.getFullYear();

                    li.appendChild(a);
                    li.appendChild(span);
                    list.appendChild(li);
                });
            })
            .catch(function() {
                document.getElementById('post-list').innerHTML =
                    '<li style="color:#999;">No posts yet.</li>';
            });
    </script>
</body>
</html>
