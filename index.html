<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKE</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <a href="/" class="sidebar-logo">MKE</a>
            <ul class="sidebar-nav">
                <li><a href="/output/">Output</a></li>
                <li><a href="/captures/">Captures</a></li>
                <li><a href="/intake/">Intake</a></li>
                <li><a href="/tags/">Tags</a></li>
                <li><a href="/about/">About</a></li>
            </ul>
            <div class="sidebar-footer">
                <span class="last-updated">Updated Feb 2026</span>
            </div>
        </aside>

        <main class="main">
            <!-- Output Section -->
            <div class="section-header">
                <a href="/output/"><h2>Output</h2></a>
                <a href="/output/">→</a>
            </div>
            <ul class="post-list" id="output-preview">
                <li><p style="color:#999;">Loading...</p></li>
            </ul>

            <!-- Captures Section -->
            <div class="section-header">
                <a href="/captures/"><h2>Captures</h2></a>
                <a href="/captures/">→</a>
            </div>
            <div class="captures-row" id="captures-preview">
                <!-- JS will populate this -->
            </div>

            <!-- Intake Section -->
            <div class="section-header">
                <a href="/intake/"><h2>Intake</h2></a>
                <a href="/intake/">→</a>
            </div>
            <div class="intake-row" id="intake-preview">
                <!-- JS will populate this with thumbnails -->
            </div>
        </main>
    </div>

    <script>
        function photoUrl(relativePath) {
            return '/photos/' + String(relativePath).split('/').map(function(part) {
                return encodeURIComponent(part);
            }).join('/');
        }

        function placeDateCaption(photo) {
            var months = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            var parts = [];
            if (photo.location) parts.push(photo.location);
            if (photo.date && photo.date.length >= 7) {
                var month = parseInt(photo.date.slice(5, 7), 10);
                if (month >= 1 && month <= 12) parts.push(months[month - 1] + ' ' + photo.date.slice(0, 4));
            }
            return parts.join(', ');
        }

        // Load Output
        fetch('/output/posts.json')
            .then(function(response) { return response.json(); })
            .then(function(posts) {
                var list = document.getElementById('output-preview');
                list.innerHTML = '';

                if (posts.length === 0) {
                    list.innerHTML = '<li><p style="color:#999;">No posts yet.</p></li>';
                    return;
                }

                posts.forEach(function(post) {
                    var li = document.createElement('li');

                    var link = document.createElement('a');
                    link.href = '/output/' + post.slug + '/';
                    link.textContent = post.title;

                    var date = document.createElement('span');
                    date.className = 'date';
                    date.textContent = post.date;

                    li.appendChild(link);
                    li.appendChild(date);
                    list.appendChild(li);
                });
            })
            .catch(function() {
                document.getElementById('output-preview').innerHTML =
                    '<li><p style="color:#999;">No posts yet.</p></li>';
            });

        // Load Captures
        fetch('/captures/photos/photos.json')
            .then(function(response) { return response.json(); })
            .then(function(photos) {
                photos = photos.filter(function(photo) { return photo.status !== 'draft'; });
                photos.sort(function(a, b) {
                    return String(a.date).localeCompare(String(b.date));
                });

                photos.forEach(function(photo, index) {
                    photo.number = String(index + 1).padStart(3, '0');
                });

                var preview = document.getElementById('captures-preview');
                preview.innerHTML = '';

                var newest = photos.slice().reverse().slice(0, 5);
                newest.forEach(function(photo) {
                    var link = document.createElement('a');
                    link.href = '/captures/';

                    var container = document.createElement('div');
                    container.className = 'capture-preview-item';

                    if (!photo.thumb) return;
                    var img = document.createElement('img');
                    img.src = photoUrl(photo.thumb);
                    img.alt = placeDateCaption(photo) || ('Capture #' + photo.number);
                    if (photo.thumbWidth) img.width = photo.thumbWidth;
                    if (photo.thumbHeight) img.height = photo.thumbHeight;
                    img.loading = 'lazy';
                    img.decoding = 'async';

                    var num = document.createElement('span');
                    num.className = 'capture-number';
                    num.textContent = photo.number;

                    container.appendChild(img);
                    container.appendChild(num);
                    link.appendChild(container);
                    preview.appendChild(link);
                });
            })
            .catch(function() {
                document.getElementById('captures-preview').innerHTML =
                    '<p style="color:#999;">No captures yet.</p>';
            });

        // Load Intake (with thumbnails)
        fetch('/intake/intake.json')
            .then(function(response) { return response.json(); })
            .then(function(items) {
                var preview = document.getElementById('intake-preview');
                preview.innerHTML = '';

                var count = Math.min(items.length, 5);
                for (var i = 0; i < count; i++) {
                    var item = items[i];
                    if (item.cover) {
                        var link = document.createElement('a');
                        link.href = '/intake/';

                        var img = document.createElement('img');
                        img.src = '/intake/covers/' + item.cover;
                        img.alt = item.title;

                        link.appendChild(img);
                        preview.appendChild(link);
                    }
                }
            })
            .catch(function() {
                document.getElementById('intake-preview').innerHTML =
                    '<p style="color:#999;">No items yet.</p>';
            });
    </script>
</body>
</html>
