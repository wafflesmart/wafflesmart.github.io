<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKE</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <a href="/" class="sidebar-logo">MKE</a>
            <ul class="sidebar-nav">
                <li><a href="/output/">Output</a></li>
                <li><a href="/captures/">Captures</a></li>
                <li><a href="/intake/">Intake</a></li>
                <li><a href="/about/">About</a></li>
            </ul>
        </aside>

        <main class="main">
            <!-- Output Section -->
            <div class="section-header">
                <h2>Output</h2>
                <a href="/output/">→</a>
            </div>
            <ul class="post-list">
                <li>
                    <a href="/output/under-construction/">Under Construction</a>
                    <span class="date">Jan 2026</span>
                </li>
                <li>
                    <a href="/output/thinking-historically-01/">Thinking Historically 01.</a>
                    <span class="date">Sep 2025</span>
                </li>
            </ul>

            <!-- Captures Section -->
            <div class="section-header">
                <h2>Captures</h2>
                <a href="/captures/">→</a>
            </div>
            <div class="captures-row" id="captures-preview">
                <!-- JS will populate this -->
            </div>

            <!-- Intake Section -->
            <div class="section-header">
                <h2>Intake</h2>
                <a href="/intake/">→</a>
            </div>
            <ul class="intake-list" id="intake-preview">
                <li style="color:#999;">Loading...</li>
            </ul>
        </main>
    </div>

    <script>
        // Load Captures
        fetch('/captures/photos/photos.json')
            .then(function(response) { return response.json(); })
            .then(function(photos) {
                photos.sort(function(a, b) {
                    return new Date(a.date) - new Date(b.date);
                });

                photos.forEach(function(photo, index) {
                    photo.number = String(index + 1).padStart(3, '0');
                });

                var preview = document.getElementById('captures-preview');
                preview.innerHTML = '';

                var newest = photos.slice().reverse().slice(0, 5);
                newest.forEach(function(photo) {
                    var link = document.createElement('a');
                    link.href = '/captures/';

                    var container = document.createElement('div');
                    container.className = 'capture-preview-item';

                    var img = document.createElement('img');
                    img.src = '/photos/' + encodeURIComponent(photo.file);
                    img.alt = 'Capture #' + photo.number;

                    var num = document.createElement('span');
                    num.className = 'capture-number';
                    num.textContent = photo.number;

                    container.appendChild(img);
                    container.appendChild(num);
                    link.appendChild(container);
                    preview.appendChild(link);
                });
            })
            .catch(function() {
                document.getElementById('captures-preview').innerHTML =
                    '<p style="color:#999;">No captures yet.</p>';
            });

        // Load Intake
        fetch('/intake/intake.json')
            .then(function(response) { return response.json(); })
            .then(function(items) {
                var list = document.getElementById('intake-preview');
                list.innerHTML = '';

                var count = Math.min(items.length, 4);
                for (var i = 0; i < count; i++) {
                    var item = items[i];
                    var li = document.createElement('li');
                    li.textContent = item.title;

                    var span = document.createElement('span');
                    span.className = 'source';
                    span.textContent = item.creator;

                    li.appendChild(document.createTextNode(' '));
                    li.appendChild(span);
                    list.appendChild(li);
                }
            })
            .catch(function() {
                document.getElementById('intake-preview').innerHTML =
                    '<li style="color:#999;">No items yet.</li>';
            });
    </script>
</body>
</html>
