    <h1>Photography</h1>

    <!--
    =====================================================
    HOW TO ORGANIZE PHOTOS:

    1. SECTIONS: Each trip/collection goes in a <div class="photo-section">
       with a <h2 class="photo-section-title"> header

    2. DISPLAY ORDER: Photos display in the order they appear in the HTML.
       To reorder: cut and paste the entire <div class="photo-item">...</div>
       block to the position you want.

    3. HOMEPAGE: The homepage pulls the first 3 photos from the FIRST section.
       Put your best/most recent photos at the top of the first section.
    =====================================================
    -->
