<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Writing – MKE</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="wide">
    <nav>
        <a href="/">home</a>
        <span class="sep">•</span>
        <a href="/writing/">writing</a>
        <span class="sep">•</span>
        <a href="/photography/">photography</a>
        <span class="sep">•</span>
        <a href="/work/">work</a>
        <span class="sep">•</span>
        <a href="/contact/">contact</a>
    </nav>

    <h1>Writing</h1>

    <div class="writing-container">
        <div class="writing-main">
            <ul class="essay-list">
                <li>
                    <a href="/essays/thinking-historically-01/" data-words="150">Thinking Historically 01.</a>
                    <span class="date">September 2025</span>
                </li>
            </ul>
        </div>

        <fieldset class="stats-box">
            <legend>Stats</legend>
            <div class="stat-item">
                <span class="stat-label">Post count:</span>
                <span class="stat-value" id="essay-count">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Word count:</span>
                <span class="stat-value" id="word-count">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Book pages:</span>
                <span class="stat-value" id="page-count">0</span>
            </div>
        </fieldset>
    </div>

    <script>
        (function() {
            const essays = document.querySelectorAll('.essay-list a[data-words]');
            const essayCount = essays.length;
            let totalWords = 0;

            essays.forEach(function(essay) {
                totalWords += parseInt(essay.dataset.words, 10) || 0;
            });

            const pages = Math.ceil(totalWords / 250);

            document.getElementById('essay-count').textContent = essayCount;
            document.getElementById('word-count').textContent = totalWords.toLocaleString();
            document.getElementById('page-count').textContent = pages;
        })();
    </script>
</body>
</html>
