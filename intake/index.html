<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intake – MKE</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <a href="/" class="sidebar-logo">MKE</a>
            <ul class="sidebar-nav">
                <li><a href="/output/">Output</a></li>
                <li><a href="/captures/">Captures</a></li>
                <li><a href="/intake/" class="active">Intake</a></li>
                <li><a href="/tags/">Tags</a></li>
                <li><a href="/about/">About</a></li>
            </ul>
            <div class="sidebar-footer">
                <span class="last-updated">Updated Feb 2026</span>
            </div>
        </aside>

        <main class="main">
            <h1>Intake</h1>

            <div class="intake-filters" id="type-filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="book">Books</button>
                <button class="filter-btn" data-filter="music">Music</button>
                <button class="filter-btn" data-filter="movie">Movies</button>
                <button class="filter-btn" data-filter="video">Videos</button>
                <button class="filter-btn" data-filter="speech">Speeches</button>
            </div>

            <div class="intake-filters" id="status-filters">
                <button class="filter-btn active" data-filter="all">All Statuses</button>
                <button class="filter-btn" data-filter="reading">Reading</button>
                <button class="filter-btn" data-filter="finished">Finished</button>
                <button class="filter-btn" data-filter="reference">Reference</button>
                <button class="filter-btn" data-filter="queued">Queued</button>
            </div>

            <div class="intake-grid" id="intake-grid">
                <p style="color:#999;">Loading...</p>
            </div>
        </main>
    </div>

    <script>
        var currentTypeFilter = 'all';
        var currentStatusFilter = 'all';
        var tagsData = {};

        // Fetch tags first, then items
        fetch('/tags.json')
            .then(function(response) { return response.json(); })
            .then(function(tags) {
                tagsData = tags;
                return fetch('/intake/intake.json');
            })
            .then(function(response) { return response.json(); })
            .then(function(items) {
                renderItems(items);

                // Type filter buttons
                document.querySelectorAll('#type-filters .filter-btn').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        document.querySelectorAll('#type-filters .filter-btn').forEach(function(b) {
                            b.classList.remove('active');
                        });
                        btn.classList.add('active');
                        currentTypeFilter = btn.dataset.filter;
                        renderItems(items);
                    });
                });

                // Status filter buttons
                document.querySelectorAll('#status-filters .filter-btn').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        document.querySelectorAll('#status-filters .filter-btn').forEach(function(b) {
                            b.classList.remove('active');
                        });
                        btn.classList.add('active');
                        currentStatusFilter = btn.dataset.filter;
                        renderItems(items);
                    });
                });
            })
            .catch(function() {
                document.getElementById('intake-grid').innerHTML =
                    '<p style="color:#999;">No items yet.</p>';
            });

        function renderTags(tags) {
            if (!tags || tags.length === 0) return '';
            var html = '<div class="tags-container">';
            tags.forEach(function(tag) {
                var tagInfo = tagsData[tag] || { label: tag, color: '#666' };
                html += '<a href="/tags/#' + tag + '" class="tag-pill" style="background:' + tagInfo.color + '">' + tagInfo.label + '</a>';
            });
            html += '</div>';
            return html;
        }

        function renderItems(items) {
            var grid = document.getElementById('intake-grid');
            grid.innerHTML = '';

            var filtered = items.filter(function(item) {
                var typeMatch = currentTypeFilter === 'all' || item.type === currentTypeFilter;
                var statusMatch = currentStatusFilter === 'all' || item.status === currentStatusFilter;
                return typeMatch && statusMatch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<p style="color:#999;">No items in this category.</p>';
                return;
            }

            filtered.forEach(function(item) {
                var card = document.createElement('div');
                card.className = 'intake-card';
                card.dataset.type = item.type;

                var hasCover = item.cover && item.cover.length > 0;
                var isTextOnly = !hasCover && ['video', 'speech'].indexOf(item.type) > -1;

                // Build title (with optional link)
                var titleHtml = item.link
                    ? '<a href="' + item.link + '" target="_blank">' + item.title + '</a>'
                    : item.title;

                // Build status badge
                var statusBadge = item.status
                    ? '<span class="status-badge">' + item.status + '</span>'
                    : '';

                // Build tags
                var tagsHtml = renderTags(item.tags);

                if (hasCover) {
                    // Flip card with cover
                    card.classList.add('flip-card');
                    if (item.type === 'music') card.classList.add('square');

                    var inner = document.createElement('div');
                    inner.className = 'flip-card-inner';

                    var front = document.createElement('div');
                    front.className = 'flip-card-front';
                    var img = document.createElement('img');
                    img.src = '/intake/covers/' + item.cover;
                    img.alt = item.title;
                    front.appendChild(img);

                    var back = document.createElement('div');
                    back.className = 'flip-card-back';
                    back.innerHTML =
                        statusBadge +
                        '<div class="card-title">' + titleHtml + '</div>' +
                        (item.creator ? '<div class="card-creator">' + item.creator + '</div>' : '') +
                        (item.comment ? '<div class="card-comment">' + item.comment + '</div>' : '') +
                        tagsHtml;

                    inner.appendChild(front);
                    inner.appendChild(back);
                    card.appendChild(inner);
                } else {
                    // Text-only card
                    card.classList.add('text-card');
                    card.innerHTML =
                        '<div class="card-title">' + titleHtml + '</div>' +
                        (item.creator ? '<div class="card-creator">' + item.creator + '</div>' : '') +
                        (item.comment ? '<div class="card-comment">' + item.comment + '</div>' : '') +
                        tagsHtml;
                }

                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
