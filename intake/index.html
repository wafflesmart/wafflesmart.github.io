<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intake – MKE</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <a href="/" class="sidebar-logo">MKE</a>
            <ul class="sidebar-nav">
                <li><a href="/output/">Output</a></li>
                <li><a href="/captures/">Captures</a></li>
                <li><a href="/intake/" class="active">Intake</a></li>
                <li><a href="/about/">About</a></li>
            </ul>
        </aside>

        <main class="main">
            <h1>Intake</h1>

            <div class="intake-filters">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="book">Books</button>
                <button class="filter-btn" data-filter="music">Music</button>
                <button class="filter-btn" data-filter="movie">Movies</button>
                <button class="filter-btn" data-filter="video">Videos</button>
                <button class="filter-btn" data-filter="speech">Speeches</button>
            </div>

            <div class="intake-grid" id="intake-grid">
                <p style="color:#999;">Loading...</p>
            </div>
        </main>
    </div>

    <script>
        var currentFilter = 'all';

        fetch('/intake/intake.json')
            .then(function(response) { return response.json(); })
            .then(function(items) {
                renderItems(items);

                // Filter buttons
                document.querySelectorAll('.filter-btn').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        document.querySelectorAll('.filter-btn').forEach(function(b) {
                            b.classList.remove('active');
                        });
                        btn.classList.add('active');
                        currentFilter = btn.dataset.filter;
                        renderItems(items);
                    });
                });
            })
            .catch(function() {
                document.getElementById('intake-grid').innerHTML =
                    '<p style="color:#999;">No items yet.</p>';
            });

        function renderItems(items) {
            var grid = document.getElementById('intake-grid');
            grid.innerHTML = '';

            var filtered = items.filter(function(item) {
                return currentFilter === 'all' || item.type === currentFilter;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<p style="color:#999;">No items in this category.</p>';
                return;
            }

            filtered.forEach(function(item) {
                var card = document.createElement('div');
                card.className = 'intake-card';
                card.dataset.type = item.type;

                var isMediaCard = ['book', 'music', 'movie'].indexOf(item.type) > -1;
                var isTextCard = ['video', 'speech'].indexOf(item.type) > -1;

                if (isMediaCard) {
                    // Flip card with cover
                    card.classList.add('flip-card');
                    if (item.type === 'music') card.classList.add('square');

                    var inner = document.createElement('div');
                    inner.className = 'flip-card-inner';

                    // Front (cover image)
                    var front = document.createElement('div');
                    front.className = 'flip-card-front';
                    if (item.cover) {
                        var img = document.createElement('img');
                        img.src = '/intake/covers/' + item.cover;
                        img.alt = item.title;
                        front.appendChild(img);
                    } else {
                        front.innerHTML = '<div class="no-cover">' + item.title + '</div>';
                    }

                    // Back (details)
                    var back = document.createElement('div');
                    back.className = 'flip-card-back';
                    back.innerHTML =
                        '<div class="card-title">' + item.title + '</div>' +
                        '<div class="card-creator">' + item.creator + '</div>' +
                        (item.comment ? '<div class="card-comment">' + item.comment + '</div>' : '');

                    inner.appendChild(front);
                    inner.appendChild(back);
                    card.appendChild(inner);
                } else if (isTextCard) {
                    // Text-only card
                    card.classList.add('text-card');
                    card.innerHTML =
                        '<div class="card-title">' + item.title + '</div>' +
                        '<div class="card-creator">' + item.creator + '</div>' +
                        (item.comment ? '<div class="card-comment">' + item.comment + '</div>' : '');
                }

                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
